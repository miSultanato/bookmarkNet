<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 290" width="290" height="290">
  <defs>
    <linearGradient id="lotura-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BC0F0"/>
      <stop offset="100%" stop-color="#2E7BF6"/>
    </linearGradient>
    <linearGradient id="lotura-ml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7BF6"/>
      <stop offset="100%" stop-color="#3B5BDB"/>
    </linearGradient>
    <linearGradient id="lotura-bl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5BDB"/>
      <stop offset="100%" stop-color="#5B4FD6"/>
    </linearGradient>
    <linearGradient id="lotura-bm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4FD6"/>
      <stop offset="100%" stop-color="#7B4FE0"/>
    </linearGradient>
    <linearGradient id="lotura-br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B4FE0"/>
      <stop offset="100%" stop-color="#8B4FE8"/>
    </linearGradient>
  </defs>
  <!-- Columna vertical (izquierda) -->
  <rect x="0"   y="0"   width="90" height="90" rx="20" fill="url(#lotura-tl)"/>
  <rect x="0"   y="100" width="90" height="90" rx="20" fill="url(#lotura-ml)"/>
  <rect x="0"   y="200" width="90" height="90" rx="20" fill="url(#lotura-bl)"/>
  <!-- Fila horizontal (inferior) -->
  <rect x="100" y="200" width="90" height="90" rx="20" fill="url(#lotura-bm)"/>
  <rect x="200" y="200" width="90" height="90" rx="20" fill="url(#lotura-br)"/>
</svg>
