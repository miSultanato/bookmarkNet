<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title">
  <title id="title">Lotura — Guarda enlaces. Comparte colecciones.</title>
  <defs>
    <linearGradient id="lotura-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BC0F0"/>
      <stop offset="25%" stop-color="#2E7BF6"/>
      <stop offset="50%" stop-color="#3B5BDB"/>
      <stop offset="75%" stop-color="#5B4FD6"/>
      <stop offset="100%" stop-color="#8B4FE8"/>
    </linearGradient>
  </defs>
  <g transform="translate(350 35)">
    <rect x="0" y="0" width="90" height="90" rx="20" fill="url(#lotura-gradient)"/>
    <rect x="0" y="96" width="90" height="90" rx="20" fill="url(#lotura-gradient)"/>
    <rect x="0" y="192" width="90" height="90" rx="20" fill="url(#lotura-gradient)"/>
    <rect x="96" y="192" width="90" height="90" rx="20" fill="url(#lotura-gradient)"/>
    <rect x="192" y="192" width="90" height="90" rx="20" fill="url(#lotura-gradient)"/>
  </g>
  <text x="500" y="475" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="150" letter-spacing="-5" fill="#1A1D23">Lotura</text>
  <text x="500" y="555" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="32" fill="#6B7280">Guarda enlaces. Comparte colecciones.</text>
  <text x="500" y="610" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="27" fill="#6B7280">Crea, comparte y descubre colecciones de enlaces.</text>
</svg>