<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title">
  <title id="title">Lotura — Guarda enlaces. Comparte colecciones.</title>
  <defs>
    <linearGradient id="lotura-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BC0F0"/>
      <stop offset="25%" stop-color="#2E7BF6"/>
      <stop offset="50%" stop-color="#3B5BDB"/>
      <stop offset="75%" stop-color="#5B4FD6"/>
